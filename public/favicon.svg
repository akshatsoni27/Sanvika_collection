<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Royal Burgundy Background -->
  <rect width="100" height="100" rx="20" fill="#520b18" />
  
  <!-- Outer Gold Ring -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="#c59b4e" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.85" />
  <circle cx="50" cy="50" r="41" fill="none" stroke="#e8c87c" stroke-width="1" opacity="0.95" />
  <circle cx="50" cy="50" r="38" fill="none" stroke="#c59b4e" stroke-width="0.75" opacity="0.6" />

  <!-- Gold Monogram 'S' -->
  <text 
    x="50" 
    y="66" 
    font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" 
    font-size="52" 
    font-weight="600" 
    font-style="italic"
    fill="url(#goldGradient)" 
    text-anchor="middle"
  >S</text>

  <!-- Sparkle Accents -->
  <circle cx="50" cy="14" r="1.5" fill="#f8e7b9" />
  <circle cx="50" cy="86" r="1.5" fill="#f8e7b9" />
  <circle cx="14" cy="50" r="1.5" fill="#f8e7b9" />
  <circle cx="86" cy="50" r="1.5" fill="#f8e7b9" />

  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcedc7" />
      <stop offset="40%" stop-color="#d4af37" />
      <stop offset="80%" stop-color="#b8860b" />
      <stop offset="100%" stop-color="#f5d77f" />
    </linearGradient>
  </defs>
</svg>
